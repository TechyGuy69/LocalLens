<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalLens — India's Anti-Tourist Guide</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { background: #f5f0e8; color: #1c1917; font-family: 'Outfit', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-thumb { background: #c8ad8f; border-radius: 2px; }

      /* Leaflet full light theme — bright, colourful, beautiful */
      .leaflet-container { background: #e8e0d5 !important; }
      .leaflet-tile { filter: saturate(1.2) brightness(1.03) contrast(1.02); }
      .leaflet-control-zoom { border: none !important; border-radius: 14px !important; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.12) !important; }
      .leaflet-control-zoom a { background: #fff !important; color: #1c1917 !important; border: none !important; border-bottom: 1px solid #f0ece6 !important; width: 38px !important; height: 38px !important; line-height: 38px !important; font-size: 16px !important; font-weight: 300 !important; transition: background 0.2s; }
      .leaflet-control-zoom a:last-child { border-bottom: none !important; }
      .leaflet-control-zoom a:hover { background: #f5f0e8 !important; color: #2d6a4f !important; }
      .leaflet-control-attribution { background: rgba(255,255,255,0.75) !important; color: #bbb !important; font-size: 9px !important; backdrop-filter: blur(8px); border-radius: 8px 0 0 0 !important; }
      .leaflet-popup-content-wrapper { background: #fff !important; border-radius: 20px !important; box-shadow: 0 20px 60px rgba(0,0,0,0.15) !important; border: none !important; padding: 0 !important; overflow: hidden; }
      .leaflet-popup-content { margin: 0 !important; }
      .leaflet-popup-tip { background: #fff !important; box-shadow: none !important; }
      .leaflet-popup-close-button { color: #aaa !important; font-size: 20px !important; padding: 8px 10px !important; z-index: 10; }
      .leaflet-popup-close-button:hover { color: #1c1917 !important; background: transparent !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
